/* ---------------- suggest ---------------- */
function rotationInfo(fid){
  var f=fxById(fid),prev=sortedFx().filter(function(x){return x.date<f.date&&x.id!==fid&&S.sel[x.id]&&((S.matches[x.id]&&S.matches[x.id].lineup.some(Boolean))||(S.sel[x.id].lineup||[]).some(Boolean));}).reverse();
  var lastRes={},absent={},thr=S.rules.general.awayWeeks||3;
  if(prev[0])(S.sel[prev[0].id].reserves||[]).forEach(function(p){lastRes[p]=1;});
  S.players.forEach(function(p){var n=0;for(var i=0;i<prev.length;i++){var sl=S.sel[prev[i].id],ln=S.matches[prev[i].id]?S.matches[prev[i].id].lineup:sl.lineup;if(ln.indexOf(p.id)>-1||(sl.reserves||[]).indexOf(p.id)>-1)break;n++;}absent[p.id]=n;});
  return {lastRes:lastRes,absent:absent,thr:thr,returning:function(id){return prev.length>=thr&&absent[id]>=thr;}};
}
function isCupFx(f){return rulesFor(f).result==='pins';}
function suggest(fid){
  var f=fxById(fid),sel=selFor(fid),am=avgMap(),act=S.players.filter(function(p){return p.active;}),cup=isCupFx(f),R=rotationInfo(fid),warn=[];
  var score=function(p){return am[p.id]?am[p.id].avgHand:0;};
  var tier=function(p){if(cup)return 1;if(R.lastRes[p.id])return 0;if(R.returning(p.id))return 2;return 1;};
  var rank=function(a,b){return (tier(a)-tier(b))||(score(b)-score(a));};
  var pool=act.filter(function(p){return sel.avail[p.id]==='in';}).sort(rank);
  var maybes=[]; // v3.2: In or Out only, no maybes
  var chosen=pool.slice(0,12),reserves=pool.slice(12);
  if(chosen.length<12){var fill=maybes.slice(0,12-chosen.length);chosen=chosen.concat(fill);reserves=reserves.concat(maybes.slice(fill.length));}else reserves=reserves.concat(maybes);
  var line=Array(12).fill(null),used={};
  [1,2,3,4].forEach(function(s){var req=chosen.filter(function(p){return sel.req[p.id]===s;}).sort(function(a,b){return score(b)-score(a);});
    if(req.length>3)warn.push(req.length+' picked players asked for set '+s+'; only 3 fit.');
    req.slice(0,3).forEach(function(p,i){line[(s-1)*3+i]=p.id;used[p.id]=1;});});
  var orderSlots=[11,8,5,2,10,7,4,1,9,6,3,0],rest=chosen.filter(function(p){return !used[p.id];}).sort(function(a,b){return score(b)-score(a);});
  orderSlots.forEach(function(si){if(line[si])return;var p=rest.shift();if(p){line[si]=p.id;used[p.id]=1;}});
  rest.forEach(function(p){reserves.unshift(p);});
  for(var s=0;s<4;s++){var ids=line.slice(s*3,s*3+3).filter(Boolean);ids.sort(function(a,b){return score(player(a))-score(player(b));});var pad=3-ids.length;for(var k=0;k<3;k++)line[s*3+k]=k<pad?null:ids[k-pad];}
  if(cup)warn.push('Cup match: strongest available players picked.');
  else{var rot=chosen.filter(function(p){return R.lastRes[p.id];});if(rot.length)warn.push('Reserve last week, so picked this week: '+rot.map(function(p){return p.name;}).join(', ')+'.');
    var back=reserves.filter(function(p){return R.returning(p.id)&&sel.avail[p.id]==='in';});if(back.length)warn.push('Back after '+R.thr+'+ weeks away, so reserve this week: '+back.map(function(p){return p.name;}).join(', ')+'.');}
  reserves.filter(function(p){return sel.req[p.id];}).forEach(function(p){warn.push(p.name+' asked for set '+sel.req[p.id]+' but is a reserve this week.');});
  if(pool.length<12)warn.push(pool.length+' players marked In'+(maybes.length?'; Maybe players used to fill':'')+'.');
  if(chosen.length<12)warn.push((12-chosen.length)+' slot'+(12-chosen.length>1?'s':'')+' still empty.');
  sel.lineup=line;sel.reserves=reserves.map(function(p){return p.id;});return warn;
}

function reportText(){var f=curFx(),m=S.matches[f.id],r=m.rules,R=result(m),L=[],pins=r.result==='pins',opp=oppTeam(m);
  var title=f.home?'Lions '+R.A+' – '+R.B+' '+opp:opp+' '+R.B+' – '+R.A+' Lions';
  L.push('🦁 *Match report: '+title+'*');L.push('_'+fxComp(f)+' · '+fdate(f.date)+' · '+(f.home?'Home':'Away')+'_');L.push('');
  var won=[],lost=[];for(var s=0;s<r.sets;s++){var a=setTot(m,'L',s),b=setTot(m,'O',s);if(a>b)won.push(s+1);else if(b>a)lost.push(s+1);}
  var lst=function(x){return x.length>1?x.slice(0,-1).join(', ')+' and '+x.slice(-1):String(x[0]);};
  if(!R.done)L.push('Match still in progress.');
  else if(R.winner==='L')L.push(pins?'Lions won by '+(R.A-R.B)+' pins.':'Lions won '+R.l+'–'+R.o+' on points'+(won.length?', taking set'+(won.length>1?'s ':' ')+lst(won):'')+' and the match by '+(R.A-R.B)+' pins.');

  else L.push('Level on '+R.A+' pins'+(pins?'.':', '+R.l+'–'+R.o+' on points.'));
  L.push('');
  var bi=0;for(var p=1;p<mP(m);p++)if(pTot(m,'L',p)>pTot(m,'L',bi))bi=p;var bsp=m.L[bi].filter(function(c){return c&&c.sp;}).length;
  L.push('*Top scorer:* '+slotName(m,'L',bi,'report')+' with '+pTot(m,'L',bi)+(bsp?', including '+bsp+' spare'+(bsp>1?'s':''):'')+'.');
  var an=mP(m)-1;if(an!==bi)L.push('*Anchor:* '+slotName(m,'L',an,'report')+' closed it out with '+pTot(m,'L',an)+'.');
  // steadiest

    return loadPeople();}).then(function(){return pull(!SY.ready);});
  SB.channel('lions-den').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){onRemote(p.new);})

function newPwModal(){modal('<h4>Choose a new password</h4><div class="field"><label>New password (6 or more characters)</label><input id="npPw" type="password" autocomplete="new-password"></div><button class="btn gold" data-act="newpw">Save password</button><button class="btn ghost" data-act="close">Cancel</button>');}
function fval(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function authAct(a,d){if(!SB){toast('Sharing isn’t available');return;}
  var fail=function(e){modal('<h4>That didn’t work</h4><div class="warn">'+esc(errMsg(e))+'</div><button class="btn gold" data-act="close">OK</button>');};
  if(a==='signin'){var em=fval('siEmail'),pw=fval('siPw');if(!em||!pw){toast('Enter your email and password');return;}toast('Signing in…');

/* ---------------- subs (admins only) ---------------- */
function subFee(){return +(S.rules.general.subFee||5);}
function subsFrom(){return S.rules.general.subsFrom||'2026-11-09';}
function subsOf(fid){S.subs=S.subs||{};return S.subs[fid]||{};}
function nightPlayers(fid){var m=S.matches[fid],l=m?m.lineup:(S.sel[fid]&&S.sel[fid].lineup)||[],seen={};
  return l.filter(function(id){if(!id||id==='LS'||seen[id]||!player(id))return false;seen[id]=1;return true;});}
function subsTable(){var rows={};S.fixtures.forEach(function(f){var m=S.matches[f.id];if(!m||f.date<subsFrom()||f.status==='cancelled')return;var pd=subsOf(f.id);
    nightPlayers(f.id).forEach(function(pid){var r=rows[pid]||(rows[pid]={pid:pid,n:0,paid:0,nights:[]});r.n++;if(pd[pid])r.paid++;r.nights.push(f.id);});});
  return Object.keys(rows).map(function(k){var r=rows[k];r.owe=(r.n-r.paid)*subFee();return r;}).sort(function(a,b){return (b.owe-a.owe)||firstSort(player(a.pid),player(b.pid));});}
function subsCard(f){if(!isAdmin())return '';var ids=nightPlayers(f.id);if(!ids.length)return '';var pd=subsOf(f.id),n=ids.filter(function(id){return pd[id];}).length;
  return '<div class="sec">Subs · £'+subFee()+' a night</div><div class="card"><div class="chips" style="padding-top:0"><span class="chip '+(n===ids.length?'g':'o')+'">'+n+' of '+ids.length+' paid · £'+(n*subFee())+'</span></div><div class="list">'+
    ids.map(function(id){return '<div><div class="grow name">'+esc(fullName(player(id)))+'</div><button class="btn sm '+(pd[id]?'gold':'ghost')+'" data-act="subtick" data-f="'+f.id+'" data-id="'+id+'">'+(pd[id]?'✓ Paid':'£'+subFee()+' due')+'</button></div>';}).join('')+
    '</div><div class="note">Only admins see subs. Players in the line-up pay; reserves who don’t play don’t.</div></div>';}
function vSubs(){if(!isAdmin())return '<div class="card">Subs are only shown to admins.</div>';var t=subsTable(),paid=0,owed=0;t.forEach(function(r){paid+=r.paid*subFee();owed+=r.owe;});
