# Publishes the Lions Den app to https://the-lions-den.github.io
# Runs when a new version is pushed, and every 3 hours to refresh the league table, cup draws and fixtures check.
name: Publish the Lions Den

on:
  push:
    branches: [main]
    paths-ignore: ['backups/**', 'README.md']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the league website
        run: |
          mkdir -p _site
          cp -r app/. _site/
          curl -fsS https://the-lions-den.github.io/feed.json -o prev-feed.json || true
          python3 scripts/feed.py _site/feed.json prev-feed.json

      - name: Keep the shared data awake
        run: |
          curl -fsS "https://hjwpwiiebbnjykkywckx.supabase.co/rest/v1/docs?select=key&limit=1" \
            -H "apikey: sb_publishable_bIlvRQY33E9Gg0mmUOFklQ_xnM9Ngy1" -o /dev/null \
            && echo "Supabase is awake" || echo "Supabase not reachable (not set up yet?)"

      - name: Keep the schedule switched on
        # GitHub switches off scheduled jobs after 60 days with no changes, e.g. over the summer.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*86400 )) ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "Lions Den bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "Keep the schedule switched on" && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
